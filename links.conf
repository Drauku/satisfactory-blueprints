# Maps a Satisfactory session to a blueprint folder in this repo.
#   <session name> = <repo folder>
# The session name must match the save's session exactly, including spaces.
# Several sessions may share one folder; the library is then stored once.
# Run ./link-blueprints.sh --list to see sessions found in saves and folders here.

Trees and Riches    = _master
Starter Map         = _master
Fields of Folly     = _master
Forestry Department = _master
Stoned for Success  = _master
North Rising        = _master
Wide Open Spaces    = _master
chaotifactory       = _master
platform-factory    = _master
Sandifactory        = _master
